
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar un rescate | Sistema de Rescate y Adopción</title>
    <meta name="description" content="Formulario para reportar animales rescatados.">
</head>
<body>
    <header>
        <h1>Reportar un rescate</h1>
        <p>Complete los datos del animal y del lugar del rescate.</p>

        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reportar.html" aria-current="page">Reportar un rescate</a></li>
                <li><a href="rescates.html">Consultar rescates</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="titulo-formulario">
            <h2 id="titulo-formulario">Formulario de registro</h2>

            <form action="reportar.html" method="get">
                <fieldset>
                    <legend>Información del animal</legend>

                    <p>
                        <label for="nombre-animal">Nombre del animal:</label>
                        <input type="text" id="nombre-animal" name="nombre-animal" maxlength="60">
                    </p>

                    <p>
                        <label for="especie">Especie:</label>
                        <select id="especie" name="especie" required>
                            <option value="">Seleccione una especie</option>
                            <option value="perro">Perro</option>
                            <option value="gato">Gato</option>
                            <option value="ave">Ave</option>
                            <option value="otro">Otro</option>
                        </select>
                    </p>

                    <p>
                        <label for="sexo">Sexo del animal:</label>
                        <select id="sexo" name="sexo" required>
                            <option value="">Seleccione una opción</option>
                            <option value="macho">Macho</option>
                            <option value="hembra">Hembra</option>
                            <option value="desconocido">Desconocido</option>
                        </select>
                    </p>

                    <p>
                        <label for="estado">Estado del animal:</label>
                        <select id="estado" name="estado" required>
                            <option value="">Seleccione el estado</option>
                            <option value="herido">Herido</option>
                            <option value="estable">Estable</option>
                            <option value="critico">Crítico</option>
                        </select>
                    </p>

                    <p>
                        <label for="fecha">Fecha del rescate:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Información del rescate</legend>

                    <p>
                        <label for="ubicacion">Lugar del rescate:</label>
                        <input type="text" id="ubicacion" name="ubicacion" maxlength="150" required>
                    </p>

                    <p>
                        <label for="descripcion">Descripción del caso:</label>
                        <textarea id="descripcion" name="descripcion" rows="5" maxlength="1000" required></textarea>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Datos de contacto</legend>

                    <p>
                        <label for="reportante">Nombre de quien reporta:</label>
                        <input type="text" id="reportante" name="reportante" maxlength="100" required>
                    </p>

                    <p>
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" required>
                    </p>

                    <p>
                        <label for="telefono">Teléfono de contacto:</label>
                        <input type="tel" id="telefono" name="telefono" maxlength="20" required>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Enviar reporte</button>
                    <button type="reset">Limpiar formulario</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p><a href="index.html">Volver al inicio</a></p>
        <p>Sistema de Control de Rescate y Adopción.</p>
    </footer>
</body>
</html>
